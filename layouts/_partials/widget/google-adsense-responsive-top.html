{{ if ($.Param "Services.GoogleAdsense.isEnabled") }}
{{ if not (in (printf "%#v" .Site.BaseURL) "localhost") }}
<div class='section-ad'>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{$.Param "Services.GoogleAdsense.client"}}"
        crossorigin="anonymous"></script>
    <!-- top display ad responsive -->
    <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="{{$.Param "Services.GoogleAdsense.client"}}"
        data-ad-slot="{{ if ($.Param "Services.GoogleAdsense.topDisplaySlot") }}{{$.Param "Services.GoogleAdsense.topDisplaySlot"}}{{ else }}{{$.Param "Services.GoogleAdsense.displaySlot"}}{{ end }}"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>
{{ else }}
<blockquote role="alert">
    <p><strong><span style="color: darkorange">[ad]</span> Attention! </strong>Google Adsense not available by default when the website is previewed locally.</p>
</blockquote>
{{ end }}
{{ end }}
